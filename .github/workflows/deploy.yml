name: Deploy to GitHub Pages

# Tests the site, exports it as static files and publishes them to GitHub
# Pages whenever main is updated.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked
      # base_path is empty for a user site and "/<repo>" for a project site,
      # so the same workflow works for either.
      - id: pages
        uses: actions/configure-pages@v6
      - run: cargo run --release --locked -- export --out dist --base "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
